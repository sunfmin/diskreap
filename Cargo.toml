[workspace]
resolver = "3"
members = ["crates/rules", "crates/judge", "crates/cli"]

[workspace.package]
version = "0.6.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sunfmin/diskreap"

[workspace.dependencies]
# Refinement attributes for the pure crates; they expand to nothing under a
# plain `cargo build`. ./verify.sh reads this revision: it is the Flux that
# `cargo-flux` must be built from.
flux-rs = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
# Refinement specs for core and alloc (Option, Vec, slices), from the same revision.
flux-core = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
flux-alloc = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
serde_json = "1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

# The checker ./verify.sh runs beside the Flux revision above. It refuses any
# other: each value is what the tool reports about itself, to
# `fixpoint --version` and to `z3 --version`.
[workspace.metadata.checker]
fixpoint = "0.9.6.3.8 (684d0829c19fbee83b892c9f5e20c2598897297c)"
z3 = "5.1.0"

[profile.dev.package."*"]
debug = false
